<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Révision Fouille de Données</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header + tab bar, one centered work column (max 1080px); labs use split panels that stack on phones. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface-2:#E7ECE8; --fg:#16201B; --muted:#56645D; --line:#D3DBD5;
  --accent:#0C7A63; --accent-soft:#D6EDE6; --accent-fg:#FFFFFF; --ore:#A8740A; --ore-soft:#F6E9C9;
  --good:#1D7F45; --good-soft:#DCF1E3; --bad:#B4362A; --bad-soft:#F8DEDA;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#141C19; --surface-2:#1C2622; --fg:#E3EAE6; --muted:#93A39B; --line:#2A3631;
  --accent:#3CC4A2; --accent-soft:#163A31; --accent-fg:#052019; --ore:#E2B65A; --ore-soft:#3A2F14;
  --good:#5BD98C; --good-soft:#163323; --bad:#F2857A; --bad-soft:#3D1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#141C19; --surface-2:#1C2622; --fg:#E3EAE6; --muted:#93A39B; --line:#2A3631;
  --accent:#3CC4A2; --accent-soft:#163A31; --accent-fg:#052019; --ore:#E2B65A; --ore-soft:#3A2F14;
  --good:#5BD98C; --good-soft:#163323; --bad:#F2857A; --bad-soft:#3D1D1A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
img{max-width:100%}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.45rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,code,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
code{font-size:.9em;background:var(--surface-2);padding:.05em .35em;border-radius:5px}

.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px}
.brand b{font-family:var(--f-display);font-size:1.02rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:.78rem;display:block;white-space:nowrap}
.topstats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:.8rem;color:var(--muted)}
.topstats .num{color:var(--fg);font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{appearance:none;border:0;background:none;padding:6px 10px;font-weight:600;font-size:.78rem;cursor:pointer;color:var(--muted);letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:24px 64px}
.view{display:grid;gap:20px}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:.82rem}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;font-weight:500;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.chip:hover{border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ore{background:var(--ore-soft);color:var(--ore)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical;font-family:var(--f-mono);font-size:.88rem}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero-main{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:grid;gap:14px;align-content:start;position:relative;overflow:hidden}
.hero-main h1{font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.01em}
.hero-main h1 em{font-style:normal;color:var(--accent)}
.strata{position:absolute;right:-10px;bottom:-10px;width:220px;opacity:.9;pointer-events:none;z-index:0}
.hero-main>*:not(.strata){position:relative;z-index:1}
@media (max-width:520px){.strata{display:none}}
@media (max-width:600px){.topstats{display:none}.lang{margin-left:auto}}
.mastery{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:.86rem}
.mrow button{all:unset;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button:hover{color:var(--accent)}
.mrow button:focus-visible{outline:2px solid var(--accent)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ore>i{background:var(--ore)}
.mrow .num{text-align:right;color:var(--muted);font-size:.8rem}
.qa{display:grid;gap:10px}
.qa .btn{justify-content:space-between;width:100%}
.qa .btn small{font-weight:400;color:inherit;opacity:.75}

.plan{display:grid;gap:8px}
.plan label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.plan label:hover{border-color:var(--accent)}
.plan input{margin-top:4px;accent-color:var(--accent)}
.plan .when{margin-left:auto;font-size:.76rem;color:var(--muted);white-space:nowrap}
.plan label.done span.t{text-decoration:line-through;color:var(--muted)}

/* Fiches */
.fiches{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.fiches{grid-template-columns:1fr}}
.toc{position:sticky;top:110px;display:grid;gap:2px}
@media (max-width:820px){.toc{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.toc button{white-space:nowrap;border:1px solid var(--line)!important;border-radius:999px!important}}
.toc button{appearance:none;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.88rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.toc button:hover{background:var(--surface-2);color:var(--fg)}
.toc button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.toc .s{font-family:var(--f-mono);font-size:.72rem;opacity:.8}
.sheet{display:grid;gap:16px;min-width:0}
.sheet .panel{display:grid;gap:10px}
.sheet ul,.sheet ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.sheet li{max-width:72ch}
.sheet table{border-collapse:collapse;font-size:.86rem;width:100%}
.sheet th,.sheet td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sheet th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl{overflow-x:auto}
.formula{font-family:var(--f-mono);background:var(--surface-2);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:.92rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.25}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
.callout{border-radius:8px;padding:12px 14px;background:var(--ore-soft);color:var(--fg);font-size:.9rem}
.callout b{color:var(--ore)}
.callout.tip{background:var(--accent-soft)}
.callout.tip b{color:var(--accent)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem}
.flow span{background:var(--surface-2);padding:5px 10px;border-radius:6px;font-weight:500}
.flow i{font-style:normal;color:var(--muted)}

/* Quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:16px}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qhead .timer{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.timer.low{color:var(--bad)}
.qtext{font-size:1.14rem;font-weight:600;font-family:var(--f-display);line-height:1.4}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;font-size:.95rem;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:.78rem;width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.explain{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--fg);font-size:.92rem}
.explain.bad{border-left-color:var(--bad)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score-big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.score-big small{font-size:1.1rem;color:var(--muted);font-weight:500}
.review{display:grid;gap:10px}
.review .item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px;font-size:.9rem}
.review .item .yours{color:var(--bad)}
.review .item .good{color:var(--good)}
.kbd{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* Flashcards */
.flash-stage{perspective:1400px}
.fcard{position:relative;display:grid;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fcard.flipped{transform:rotateY(180deg)}
.fface{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:28px 28px 44px;display:grid;align-content:center;gap:12px;border:1px solid var(--line);background:var(--surface)}
.fface.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.fface .big{font-family:var(--f-display);font-size:clamp(1.25rem,3.2vw,1.7rem);font-weight:600;text-wrap:balance}
.fface .ans{font-size:1.02rem;max-width:62ch}
.fface .hint{position:absolute;bottom:12px;right:16px;font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}.bar>i,.progress i{transition:none}}

/* Exercises */
.exo-out{display:grid;gap:14px}
.steps{display:grid;gap:6px;font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:14px 16px}
.steps .formula{background:var(--surface)}
.answer-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.answer-row input{width:160px;font-family:var(--f-mono)}
.verdict{font-weight:600}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}
.order-pool,.order-slots{display:flex;flex-wrap:wrap;gap:8px}
.order-slots{min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:9px}
.order-slots .chip{background:var(--accent-soft);border-color:var(--accent)}
.order-slots .chip.okc{background:var(--good-soft);border-color:var(--good)}
.order-slots .chip.koc{background:var(--bad-soft);border-color:var(--bad)}
.streak{font-family:var(--f-mono);color:var(--ore);font-weight:600}

/* Labs */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.dtable{border-collapse:collapse;font-size:.84rem;width:100%}
.dtable th,.dtable td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.dtable th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.dtable td.num,.dtable th.num{text-align:right}
.dtable tr.dim td{opacity:.32}
.dtable tfoot td{font-weight:600;border-top:2px solid var(--line)}
.dtable input{width:70px;padding:4px 6px;font-family:var(--f-mono);text-align:right}
.yes{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.gainbtn{appearance:none;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:4px}
.gainbtn:hover{border-color:var(--accent)}
.gainbtn.nope{border-color:var(--bad);background:var(--bad-soft)}
.gainbtn .g{font-family:var(--f-mono);font-weight:600}
.tree{overflow-x:auto;padding:8px 2px 12px}
.tnode{display:flex;flex-direction:column;align-items:center}
.tree>.tnode{width:max-content;margin-inline:auto}
.tbox{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.86rem;white-space:nowrap}
.tbox.attr{border-color:var(--accent);color:var(--accent)}
.tbox.leaf-oui{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.tbox.leaf-non{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tbox.pending{border-style:dashed;color:var(--muted)}
.tbox.current{border-color:var(--ore);color:var(--ore);border-style:solid;background:var(--ore-soft)}
.tbox.path{box-shadow:0 0 0 3px var(--ore)}
.tkids{display:flex;gap:14px;position:relative;padding-top:18px}
.tkid{display:flex;flex-direction:column;align-items:center;position:relative;padding-top:4px}
.tkid::before{content:"";position:absolute;top:-18px;left:50%;height:18px;border-left:1.5px solid var(--line)}
.tlink{font-size:.74rem;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.tnode>.stem{width:0;height:10px;border-left:1.5px solid var(--line)}
.hbar{position:absolute;top:0;height:0;border-top:1.5px solid var(--line)}
.matrix{display:inline-grid;gap:2px 12px;padding:6px 12px;border-left:2px solid var(--fg);border-right:2px solid var(--fg);border-radius:6px;font-family:var(--f-mono);font-size:.84rem;text-align:right}
.mx{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.mx figure{margin:0;display:grid;gap:6px;justify-items:start}
.mx figcaption{font-size:.78rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.nn svg{width:100%;height:auto;display:block;max-width:760px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono)}
input[type=range]{accent-color:var(--accent);width:100%}
.footer{color:var(--muted);font-size:.8rem;text-align:center;padding-top:20px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 18h18" stroke="var(--accent-fg)" stroke-width="2" stroke-linecap="round"/><path d="M6 14l4-5 3 3 5-6" stroke="var(--accent-fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="6" r="2" fill="var(--ore)"/></svg>
        </div>
        <div><b id="brandName">Fouille de Données</b><small id="brandSub">Master 2 ISI · diapos 1 → 165</small></div>
      </div>
      <div class="topstats" id="topstats"></div>
      <div class="lang" role="group" aria-label="Langue / Language">
        <button data-lang="fr" aria-pressed="true">FR</button><button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button class="tab" data-v="accueil" data-fr="Accueil" data-en="Home">Accueil</button>
      <button class="tab" data-v="fiches" data-fr="Fiches" data-en="Summaries">Fiches</button>
      <button class="tab" data-v="quiz" data-fr="Quiz" data-en="Quiz">Quiz</button>
      <button class="tab" data-v="cartes" data-fr="Flashcards" data-en="Flashcards">Flashcards</button>
      <button class="tab" data-v="exercices" data-fr="Exercices" data-en="Exercises">Exercices</button>
      <button class="tab" data-v="labos" data-fr="Labos" data-en="Labs">Labos</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-accueil"></section>
  <section class="view" id="v-fiches" hidden></section>
  <section class="view" id="v-quiz" hidden></section>
  <section class="view" id="v-cartes" hidden></section>
  <section class="view" id="v-exercices" hidden></section>
  <section class="view" id="v-labos" hidden></section>
  <p class="footer" id="footer"></p>
</main>

<script>
/* ============================== LANGUAGE ============================== */
const KEY="fdd-revision-v1";
let S={q:{},f:{},plan:{},best:0,streak:0,lang:"fr"};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let LANG=S.lang==="en"?"en":"fr";
const L=(fr,en)=>LANG==="en"?en:fr;
let COL=" : ";

/* ============================== DATA ============================== */
const CH = [
  {id:"intro",  t:"Introduction & applications", en:"Introduction & applications", s:"6–15"},
  {id:"ecd",    t:"Processus ECD / KDD", en:"KDD process", s:"16–31"},
  {id:"taches", t:"Tâches de la FDD", en:"Data mining tasks", s:"32–37"},

<div class="formula">Gain(A) = Entropie(S) − I(A)</div>
<div class="callout tip"><b>Réflexe :</b> 0·log₂0 = 0. Entropie = 0 si nœud pur, = 1 si p = n.</div></div>
<div class="panel"><h3>Réseaux de neurones</h3><p class="eyebrow">Diapos 161–165</p>
<div class="formula">net = Σ w<sub>i</sub>·x<sub>i</sub> + biais &nbsp;&nbsp; out = σ(net) = ${FR("1","1 + e<sup>−net</sup>")}</div>
<div class="formula">E<sub>totale</sub> = Σ ½ (prédite − réelle)²</div>
<div class="formula">${FR("∂E","∂w<sub>7</sub>")} = ${FR("∂E","∂out<sub>o1</sub>")} × ${FR("∂out<sub>o1</sub>","∂net<sub>o1</sub>")} × ${FR("∂net<sub>o1</sub>","∂w<sub>7</sub>")} = (out<sub>o1</sub> − cible)·out<sub>o1</sub>(1 − out<sub>o1</sub>)·out<sub>h1</sub></div>
<div class="formula">w<sub>7</sub><sup>+</sup> = w<sub>7</sub> − η × ${FR("∂E","∂w<sub>7</sub>")}</div></div>`,
en:`<div class="panel"><h3>Normalization</h3>
<p class="eyebrow">Decimal scaling · slide 59</p><div class="formula">v′ = ${FR("v","10<sup>k</sup>")} &nbsp; k = smallest integer with max|v′| &lt; 1 &nbsp;→ [−1, 1]</div>
<p class="eyebrow">Min-max · slide 61</p><div class="formula">v′ = ${FR("v − min","max − min")} &nbsp;→ [0, 1]</div>
<p class="eyebrow">Standard deviation (z-score) · slide 62</p><div class="formula">v* = ${FR("v − mean(v)","std(v)")}</div>
<p class="eyebrow">Simple moving average · slide 66</p><div class="formula">SMA = ${FR("A<sub>1</sub> + A<sub>2</sub> + … + A<sub>n</sub>","n")}</div></div>
<div class="panel"><h3>Regression</h3>
<p class="eyebrow">Simple · slides 86, 92</p><div class="formula">y<sub>i</sub> = a·x<sub>i</sub> + b + ε<sub>i</sub></div>
<div class="formula">a = ${FR("Σ (x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)","Σ (x<sub>i</sub> − x̄)²")} &nbsp;&nbsp; b = ȳ − a·x̄</div>
<p class="eyebrow">Multiple · slides 98, 101</p><div class="formula">y<sub>i</sub> = a<sub>0</sub> + a<sub>1</sub>x<sub>i,1</sub> + … + a<sub>p</sub>x<sub>i,p</sub> + ε<sub>i</sub></div>
<div class="formula">â = (X′X)<sup>−1</sup> X′Y</div></div>
<div class="panel"><h3>Decision trees (ID3)</h3><p class="eyebrow">Slide 116</p>
<div class="formula">${ENT("Entropy")}</div>
<div class="formula">I(A) = Σ ${FR("p<sub>i</sub> + n<sub>i</sub>","p + n")} × Entropy(A = v<sub>i</sub>)</div>
<div class="formula">Gain(A) = Entropy(S) − I(A)</div>
<div class="callout tip"><b>Remember:</b> 0·log₂0 = 0. Entropy = 0 for a pure node, = 1 when p = n.</div></div>
<div class="panel"><h3>Neural networks</h3><p class="eyebrow">Slides 161–165</p>
<div class="formula">net = Σ w<sub>i</sub>·x<sub>i</sub> + bias &nbsp;&nbsp; out = σ(net) = ${FR("1","1 + e<sup>−net</sup>")}</div>
<div class="formula">E<sub>total</sub> = Σ ½ (predicted − actual)²</div>
<div class="formula">${FR("∂E","∂w<sub>7</sub>")} = ${FR("∂E","∂out<sub>o1</sub>")} × ${FR("∂out<sub>o1</sub>","∂net<sub>o1</sub>")} × ${FR("∂net<sub>o1</sub>","∂w<sub>7</sub>")} = (out<sub>o1</sub> − target)·out<sub>o1</sub>(1 − out<sub>o1</sub>)·out<sub>h1</sub></div>
<div class="formula">w<sub>7</sub><sup>+</sup> = w<sub>7</sub> − η × ${FR("∂E","∂w<sub>7</sub>")}</div></div>`},
intro:{
fr:`<div class="panel"><h3>Pourquoi la fouille de données ?</h3>
<ul><li>Entreprises, hôpitaux, administrations génèrent d’énormes volumes de données (achats, ventes, dossiers patients…) qui ont beaucoup de valeur.</li>
<li>Besoin de méthodes pour <b>analyser</b> ces données et <b>extraire des connaissances (cachées)</b>.</li>
<li>Repose sur l’<b>analyse de données</b> et l’<b>apprentissage automatique</b>.</li></ul></div>
<div class="panel"><h3>Motivations</h3><ul><li>Disponibilité (collecte, sauvegarde) de grandes quantités de données</li><li>Machines de plus en plus puissantes</li><li>Besoin d’exploiter les données pour décider</li><li>Intersection : bases de données, statistiques, IA, visualisation</li></ul></div>
<div class="panel"><h3>Applications par domaine</h3><div class="tbl"><table>
<tr><th>Domaine</th><th>Exemples</th></tr>
<tr><td>Santé</td><td>Volume de patients, fraudes d’assurance, maladies chroniques, zones à risque de propagation, traitements plus efficaces</td></tr>
<tr><td>Banque & finance</td><td>Risques de marché, attribution de prêt, défaillants, marketing ciblé, fraude & blanchiment</td></tr>
<tr><td>Relation client</td><td>Segmentation, offres, placement en rayon, réductions, clients qui veulent changer de fournisseur</td></tr>
<tr><td>Éducation</td><td>Prédire la réussite, soutien aux étudiants, adapter les contenus, détecter les abandons</td></tr>
<tr><td>Production</td><td>Coût de développement, usure, pannes machines, planification</td></tr>
<tr><td>Autres</td><td>Criminologie, détection d’intrusion, assurance, e-commerce, bio-informatique, fouille de texte</td></tr></table></div></div>`,
en:`<div class="panel"><h3>Why data mining?</h3>
<ul><li>Companies, hospitals and administrations generate huge volumes of data (purchases, sales, patient records…) that are very valuable.</li>
<li>We need methods to <b>analyze</b> this data and <b>extract (hidden) knowledge</b>.</li>
<li>It relies on <b>data analysis</b> and <b>machine learning</b>.</li></ul></div>
<div class="panel"><h3>Motivations</h3><ul><li>Large amounts of data available (collected and stored)</li><li>Increasingly powerful machines</li><li>The need to use data to make decisions</li><li>Intersection of databases, statistics, AI, visualization</li></ul></div>
<div class="panel"><h3>Applications by field</h3><div class="tbl"><table>
<tr><th>Field</th><th>Examples</th></tr>
<tr><td>Healthcare</td><td>Patient volume, insurance fraud, chronic diseases, high-risk spread areas, more effective treatments</td></tr>
<tr><td>Banking & finance</td><td>Market risk, loan approval, defaulters, targeted marketing, fraud & money laundering</td></tr>
<tr><td>Customer relationship</td><td>Segmentation, offers, shelf placement, discounts, customers who want to switch provider</td></tr>
<tr><td>Education</td><td>Predict success, student support, adapt course content, detect dropouts</td></tr>
<tr><td>Production</td><td>Development cost, wear, machine failures, planning</td></tr>
<tr><td>Other</td><td>Criminology, intrusion detection, insurance, e-commerce, bioinformatics, text mining</td></tr></table></div></div>`},
ecd:{
fr:`<div class="panel"><h3>ECD = KDD</h3>
<p>Extraction de Connaissances à partir des Données = <b>Knowledge Discovery in Databases</b>.</p>
<ul><li><b>Prédiction / Classification</b> : générer un modèle de décision pour classer de nouvelles instances ; prédire de nouvelles valeurs.</li>
<li><b>Description / Découverte</b> : aider à comprendre les données (simplification), extraire des relations.</li></ul>
<p class="eyebrow">Le processus (diapo 17)</p>
<div class="flow"><span>Sélection</span><i>→</i><span>Prétraitement</span><i>→</i><span>Transformation</span><i>→</i><span>Fouille de données</span><i>→</i><span>Interprétation & évaluation</span></div></div>
<div class="panel"><h3>Méthodologies</h3>
<ul><li><b>CRISP-DM</b> : Cross-Industry Standard Process for Data Mining</li><li><b>SEMMA</b> (SAS) : Sample, Explore, Modify, Model, Assess</li><li><b>Six Sigma</b> (6σ)</li></ul>
<p class="eyebrow">CRISP-DM : 6 phases (cycle)</p>
<div class="tbl"><table><tr><th>Phase</th><th>Contenu</th></tr>
<tr><td>1. Compréhension du métier</td><td>Objectifs, évaluation de la situation, objectifs du Data Mining, plan de projet</td></tr>
<tr><td>2. Compréhension des données</td><td>Collecte, description, exploration, vérification des informations initiales</td></tr>
<tr><td>3. Préparation des données</td><td>Sélection, nettoyage, construction de nouvelles données, intégration, formatage</td></tr>
<tr><td>4. Modélisation</td><td>Choix des méthodes, génération des tests, création des modèles</td></tr>
<tr><td>5. Évaluation</td><td>Évaluer les résultats, réviser, planifier la suite</td></tr>
<tr><td>6. Déploiement</td><td>Planification, suivi, maintenance</td></tr></table></div></div>
<div class="panel"><h3>Les 6 étapes détaillées du processus KDD</h3><div class="tbl"><table>
<tr><th>Étape</th><th>À retenir</th></tr>
<tr><td>1. Définition du problème</td><td>Domaine, problème, objectifs → identifier les données, expliquer et évaluer les résultats, démontrer leur utilité</td></tr>
<tr><td>2. Collecte</td><td>Sources (BDD, entrepôts, fichiers, capteurs), formats (texte, image, vidéo, web), apprentissage/test, outils</td></tr>
<tr><td>3. Prétraitement</td><td>Bruit, manquantes, incohérences, unification des poids, réduction (ACP), moyenne/médiane/variance, graphes</td></tr>
<tr><td>4. Transformation</td><td>Normalisation, standardisation, discrétisation, découpage, nouveaux attributs. Parfois AVANT le prétraitement. Manuelle, automatique ou semi-automatique</td></tr>
<tr><td>5. Data mining</td><td>Choisir la technique selon type de données, objectifs, résultats attendus ; en tester plusieurs et choisir la meilleure</td></tr>
<tr><td>6. Interprétation</td><td>Modèles compréhensibles, aide à la décision simple, relations logiques expliquées</td></tr></table></div></div>`,
en:`<div class="panel"><h3>ECD = KDD</h3>
<p>ECD (French) = <b>Knowledge Discovery in Databases</b>.</p>
<ul><li><b>Prediction / Classification</b>: build a decision model to classify new instances; predict new values.</li>
<li><b>Description / Discovery</b>: help understand the data (simplification), extract relations.</li></ul>
<p class="eyebrow">The process (slide 17)</p>
<div class="flow"><span>Selection</span><i>→</i><span>Preprocessing</span><i>→</i><span>Transformation</span><i>→</i><span>Data mining</span><i>→</i><span>Interpretation & evaluation</span></div></div>
<div class="panel"><h3>Methodologies</h3>
<ul><li><b>CRISP-DM</b>: Cross-Industry Standard Process for Data Mining</li><li><b>SEMMA</b> (SAS): Sample, Explore, Modify, Model, Assess</li><li><b>Six Sigma</b> (6σ)</li></ul>
<p class="eyebrow">CRISP-DM: 6 phases (a cycle)</p>
<div class="tbl"><table><tr><th>Phase</th><th>Content</th></tr>
<tr><td>1. Business understanding</td><td>Goals, situation assessment, data mining goals, project plan</td></tr>
<tr><td>2. Data understanding</td><td>Collect, describe, explore, verify the initial information</td></tr>
<tr><td>3. Data preparation</td><td>Selection, cleaning, building new data, integration, formatting</td></tr>
<tr><td>4. Modeling</td><td>Choose methods, generate tests, build models</td></tr>
<tr><td>5. Evaluation</td><td>Evaluate results, review, plan next steps</td></tr>
<tr><td>6. Deployment</td><td>Planning, monitoring, maintenance</td></tr></table></div></div>
<div class="panel"><h3>The 6 detailed KDD steps</h3><div class="tbl"><table>
<tr><th>Step</th><th>Key points</th></tr>
<tr><td>1. Problem definition</td><td>Domain, problem, goals → identify the data, explain and evaluate results, show they are useful</td></tr>
<tr><td>2. Collection</td><td>Sources (databases, warehouses, files, sensors), formats (text, image, video, web), training/test, tools</td></tr>
<tr><td>3. Preprocessing</td><td>Noise, missing values, inconsistencies, unifying weights, reduction (PCA), mean/median/variance, charts</td></tr>
<tr><td>4. Transformation</td><td>Normalization, standardization, discretization, splitting, new attributes. Sometimes BEFORE preprocessing. Manual, automatic or semi-automatic</td></tr>
<tr><td>5. Data mining</td><td>Pick the technique based on data type, goals, expected results; try several and pick the best</td></tr>
<tr><td>6. Interpretation</td><td>Understandable models, simple decision support, explained logical relations</td></tr></table></div></div>`},
taches:{
fr:`<div class="panel"><h3>Les 5 tâches principales</h3><div class="tbl"><table>
<tr><th>Tâche</th><th>Idée</th><th>Exemples</th><th>Méthodes</th></tr>
<tr><td><b>Classification</b></td><td>Classe prédéfinie ; 2 étapes : apprentissage puis classification. Tâche la plus courante</td><td>Malade oui/non, inspecter un conteneur</td><td>Arbres, réseaux bayésiens, algos génétiques, k-ppv, régression</td></tr>
<tr><td><b>Prédiction / estimation</b></td><td>Comme la classification, sortie <b>numérique</b></td><td>Prix, glucose, tension, température</td><td>RN, réseaux bayésiens, arbres, régression</td></tr>
<tr><td><b>Clustering</b></td><td>Sous-groupes homogènes par similarité ; classes <b>inconnues</b> (non supervisé)</td><td>Profilage, intrusion, bio-info</td><td>k-moyennes, RN, hiérarchique</td></tr>
<tr><td><b>Associations</b></td><td>Si &lt;action&gt; alors &lt;conséquence&gt; (avec un taux de confiance)</td><td>Panier : smartphone → film protecteur</td><td>Apriori, FP-growth, Eclat</td></tr>
<tr><td><b>Description</b></td><td>Expliquer les données et leurs relations</td><td>Tableaux de bord</td><td>Outils de visualisation</td></tr></table></div></div>`,
en:`<div class="panel"><h3>The 5 main tasks</h3><div class="tbl"><table>
<tr><th>Task</th><th>Idea</th><th>Examples</th><th>Methods</th></tr>
<tr><td><b>Classification</b></td><td>Predefined class; 2 steps: training then classification. Most common task</td><td>Sick yes/no, inspect a container</td><td>Trees, Bayesian networks, genetic algorithms, k-NN, regression</td></tr>
<tr><td><b>Prediction / estimation</b></td><td>Like classification, <b>numeric</b> output</td><td>Price, glucose, blood pressure, temperature</td><td>Neural nets, Bayesian networks, trees, regression</td></tr>
<tr><td><b>Clustering</b></td><td>Homogeneous subgroups by similarity; classes <b>unknown</b> (unsupervised)</td><td>Profiling, intrusion, bioinformatics</td><td>k-means, neural nets, hierarchical</td></tr>
<tr><td><b>Associations</b></td><td>If &lt;action&gt; then &lt;consequence&gt; (with a confidence rate)</td><td>Basket: smartphone → screen protector</td><td>Apriori, FP-growth, Eclat</td></tr>
<tr><td><b>Description</b></td><td>Explain the data and their relations</td><td>Dashboards</td><td>Visualization tools</td></tr></table></div></div>`},
donnees:{
fr:`<div class="panel"><h3>Vocabulaire</h3><ul>
<li>Donnée = <b>individu</b> = <b>tuple</b> = <b>enregistrement</b> (une ligne)</li>
<li>Attribut = <b>variable</b> = <b>champ</b> (une colonne), chacun prend ses valeurs dans un domaine</li>
<li>Espace de données = toutes les combinaisons possibles des valeurs</li>
<li>Représentation usuelle : <b>matrice</b> enregistrements × attributs</li>
<li>Visualisation directe possible en 2D/3D ; au-delà → <b>ACP</b></li></ul></div>
<div class="panel"><h3>Types d’attributs</h3><div class="tbl"><table>
<tr><th>Famille</th><th>Type</th><th>Définition</th><th>Exemples</th></tr>
<tr><td rowspan="2">Qualitatif</td><td>Nominal</td><td>Pas d’ordre</td><td>Couleur d’une voiture, situation familiale</td></tr>
<tr><td>Ordinal</td><td>Valeurs ordonnables</td><td>Tranches d’âge, niveau d’étude (BEM, BAC, BAC+1…)</td></tr>
<tr><td rowspan="2">Quantitatif</td><td>Discret</td><td>Valeurs énumérables</td><td>Nb d’années de circulation, note d’un étudiant</td></tr>
<tr><td>Continu</td><td>Infinité de valeurs en théorie</td><td>Poids, temps d’exécution</td></tr></table></div></div>`,
en:`<div class="panel"><h3>Vocabulary</h3><ul>
<li>Data point = <b>individual</b> = <b>tuple</b> = <b>record</b> (a row)</li>
<li>Attribute = <b>variable</b> = <b>field</b> (a column); each takes its values from a domain</li>
<li>Data space = every possible combination of values</li>
<li>Usual representation: a <b>matrix</b> of records × attributes</li>
<li>Direct visualization works in 2D/3D; beyond that → <b>PCA</b> (ACP in French)</li></ul></div>
<div class="panel"><h3>Attribute types</h3><div class="tbl"><table>
<tr><th>Family</th><th>Type</th><th>Definition</th><th>Examples</th></tr>
<tr><td rowspan="2">Qualitative</td><td>Nominal</td><td>No order</td><td>Car color, marital status</td></tr>
<tr><td>Ordinal</td><td>Values can be ordered</td><td>Age groups, education level (BEM, BAC, BAC+1…)</td></tr>
<tr><td rowspan="2">Quantitative</td><td>Discrete</td><td>Countable values</td><td>Years on the road, a student’s grade</td></tr>
<tr><td>Continuous</td><td>Infinitely many values in theory</td><td>Weight, execution time</td></tr></table></div></div>`},
collecte:{
fr:`<div class="panel"><h3>Définition et compréhension du problème</h3><ul>
<li>La FDD se fait toujours dans un <b>domaine spécifique</b> → besoin de connaissances du domaine, souvent d’un <b>expert</b>.</li>
<li>Défaut fréquent : se concentrer sur la technique au détriment d’un énoncé clair du problème.</li>
<li>Le data scientist spécifie les variables de la dépendance inconnue et, si possible, une forme générale (hypothèse initiale) ; plusieurs hypothèses possibles.</li>
<li>Collaboration expert ↔ data scientist <b>pendant tout le processus</b>.</li></ul></div>
<div class="panel"><h3>Collecte et sélection</h3><ul>
<li>Sources : BDD, entrepôts, fichiers, capteurs, Web ; formats : texte, tableurs, images, vidéo, son, pages web.</li>
<li>Données annotées par les experts ; données structurées vs non structurées (fouille de texte).</li>
<li><b>Intégrité</b> : données appropriées, sources fiables (coût, facilité). <b>Confidentialité</b> : infos personnelles, données critiques.</li>
<li>Données générées : par l’expert, par simulation, par augmentation de données.</li></ul></div>
<div class="panel"><h3>Sélection de caractéristiques</h3>
<p>Choisir un sous-ensemble d’attributs pertinents ; éliminer ceux peu pertinents, redondants, bruités.</p>
<p><b>Buts :</b> meilleures performances · moins de surajustement · apprentissage plus rapide · interprétation plus facile.</p>
<div class="tbl"><table><tr><th>Technique</th><th>Principe</th></tr>
<tr><td>Filtrage</td><td>Classer les attributs par une mesure statistique (corrélation, variance)</td></tr>
<tr><td>Wrapper</td><td>Entraîner et tester des modèles sur différents sous-ensembles</td></tr>
<tr><td>Intégrées</td><td>La méthode sélectionne elle-même (arbres de décision)</td></tr>
<tr><td>Régularisation</td><td>Coefficients de pénalité sur les attributs</td></tr>
<tr><td>Réduction de dimension</td><td>ACP : réduire en gardant l’essentiel de l’information</td></tr></table></div>
<div class="callout"><b>Surajustement :</b> prédictions précises sur l’apprentissage mais pas sur les nouvelles données.</div></div>`,
en:`<div class="panel"><h3>Defining and understanding the problem</h3><ul>
<li>Data mining always happens in a <b>specific domain</b> → you need domain knowledge, often a <b>domain expert</b>.</li>
<li>Common flaw: focusing on the technique instead of a clear problem statement.</li>
<li>The data scientist specifies the variables of the unknown dependency and, if possible, a general form (initial hypothesis); several hypotheses are possible.</li>
<li>Expert ↔ data scientist collaboration <b>throughout the whole process</b>.</li></ul></div>
<div class="panel"><h3>Collection and selection</h3><ul>
<li>Sources: databases, warehouses, files, sensors, the Web; formats: text, spreadsheets, images, video, sound, web pages.</li>
<li>Data annotated by experts; structured vs unstructured data (text mining).</li>
<li><b>Integrity</b>: appropriate data, reliable sources (cost, ease). <b>Confidentiality</b>: personal info, critical data.</li>
<li>Generated data: by the expert, by simulation, by data augmentation.</li></ul></div>
<div class="panel"><h3>Feature selection</h3>
<p>Choose a subset of relevant attributes; remove irrelevant, redundant or noisy ones.</p>
<p><b>Goals:</b> better performance · less overfitting · faster training · easier interpretation.</p>
<div class="tbl"><table><tr><th>Technique</th><th>Principle</th></tr>
<tr><td>Filter</td><td>Rank attributes with a statistical measure (correlation, variance)</td></tr>
<tr><td>Wrapper</td><td>Train and test models on different subsets</td></tr>
<tr><td>Embedded</td><td>The method selects features itself (decision trees)</td></tr>
<tr><td>Regularization</td><td>Penalty coefficients on attributes</td></tr>
<tr><td>Dimensionality reduction</td><td>PCA: reduce while keeping most of the information</td></tr></table></div>
<div class="callout"><b>Overfitting:</b> accurate predictions on training data but not on new data.</div></div>`},
pretrait:{
fr:`<div class="panel"><h3>Prétraitement : étape cruciale</h3>
<p>Transformer les données brutes en un format adapté aux méthodes d’apprentissage → meilleure qualité, cohérence, pertinence → meilleur modèle. Les étapes ne sont <b>pas toutes nécessaires</b>, cela dépend de l’état des données.</p>
<div class="tbl"><table><tr><th>Étape</th><th>Ce que c’est</th><th>Exemple du cours</th></tr>
<tr><td>Nettoyage</td><td>Éliminer/corriger manquantes, incohérentes, erronées, dupliquées ; interpolation possible</td><td>Séries temporelles</td></tr>
<tr><td>Transformation</td><td>Normalisation, standardisation, log</td><td>[0, 1] vs [−100, 1000]</td></tr>
<tr><td>Encodage</td><td>Qualitatif → quantitatif</td><td>BAC, BAC+1 → 1, 2</td></tr>
<tr><td>Discrétisation</td><td>Quantitatif → qualitatif (nominal)</td><td>âge ≤ 1 → bébé ; ≤ 13 → enfant</td></tr>
<tr><td>Réduction de dimension</td><td>Retirer des attributs (ACP…)</td><td>âge + date de naissance → garder une seule</td></tr>
<tr><td>Données déséquilibrées</td><td>Génération, sur-échantillonnage, sous-échantillonnage</td><td>Crédit : 80 % non / 20 % oui → le modèle penche vers « non »</td></tr>
<tr><td>Outliers</td><td>Valeurs aberrantes incohérentes avec la majorité</td><td></td></tr>
<tr><td>Séparation</td><td>Apprentissage / test (/ validation)</td><td></td></tr></table></div></div>`,
en:`<div class="panel"><h3>Preprocessing: a crucial step</h3>
<p>Turn raw data into a format suited to learning methods → better quality, consistency, relevance → a better model. <b>Not every step is needed</b>; it depends on the state of the data.</p>
<div class="tbl"><table><tr><th>Step</th><th>What it is</th><th>Course example</th></tr>
<tr><td>Cleaning</td><td>Remove/fix missing, inconsistent, wrong or duplicate data; interpolation possible</td><td>Time series</td></tr>
<tr><td>Transformation</td><td>Normalization, standardization, log</td><td>[0, 1] vs [−100, 1000]</td></tr>
<tr><td>Encoding</td><td>Qualitative → quantitative</td><td>BAC, BAC+1 → 1, 2</td></tr>
<tr><td>Discretization</td><td>Quantitative → qualitative (nominal)</td><td>age ≤ 1 → baby; ≤ 13 → child</td></tr>
<tr><td>Dimensionality reduction</td><td>Remove attributes (PCA…)</td><td>age + date of birth → keep only one</td></tr>
<tr><td>Imbalanced data</td><td>Generation, oversampling, undersampling</td><td>Loans: 80% no / 20% yes → the model leans toward “no”</td></tr>
<tr><td>Outliers</td><td>Aberrant values inconsistent with the majority</td><td></td></tr>
<tr><td>Splitting</td><td>Training / test (/ validation)</td><td></td></tr></table></div></div>`},
norm:{
fr:`<div class="panel"><h3>Mise à l’échelle décimale (diapo 59–60)</h3>
<div class="formula">v′ = ${FR("v","10<sup>k</sup>")}</div>
<p>Valeurs dans [−1, 1]. Exemple : max = 513, min = −2135 → max|v| = 2135 → k = 4.</p>
<div class="callout"><b>Piège :</b> la diapo 59 écrit « on divise par 1000 (k = 4) ». Avec k = 4 on divise par 10⁴ = 10 000 : −2135 → −0,2135 et 513 → 0,0513. (Diviser par 1000 donnerait −2,135, hors de [−1, 1].)</div>
<p><b>Problème :</b> valeurs entre 100 et 200 → entre 0,1 et 0,2 : tout est entassé dans un petit intervalle.</p></div>
<div class="panel"><h3>Min-max (diapo 61)</h3><div class="formula">v′ = ${FR("v − min(v)","max(v) − min(v)")}</div>
<p>Résultat dans [0, 1]. Min et max trouvés ou donnés par un expert : attention aux <b>vraies</b> valeurs. Variantes vers [−1, 1].</p></div>
<div class="panel"><h3>Par écart type (diapo 62)</h3><div class="formula">v* = ${FR("v − moyenne(v)","écart type(v)")}</div>
<p>Fonctionne bien avec les mesures de distance ; transforme les données en forme non reconnaissable.</p></div>
<div class="panel"><h3>Lissage (diapos 64–66)</h3><ul>
<li>Certaines variables ont presque autant de valeurs distinctes que d’enregistrements ; ces petites différences peuvent dégrader certains modèles.</li>
<li>Lissage simple : réels → entiers (ex. 7 valeurs → 4) sans réelle perte de qualité.</li></ul>
<div class="formula">MMS = ${FR("A<sub>1</sub> + A<sub>2</sub> + … + A<sub>n</sub>","n")}</div>
<p>A<sub>i</sub> = valeur de la période i, n = nombre de périodes.</p></div>`,
en:`<div class="panel"><h3>Decimal scaling (slides 59–60)</h3>
<div class="formula">v′ = ${FR("v","10<sup>k</sup>")}</div>
<p>Values in [−1, 1]. Example: max = 513, min = −2135 → max|v| = 2135 → k = 4.</p>
<div class="callout"><b>Trap:</b> slide 59 says “divide by 1000 (k = 4)”. With k = 4 you divide by 10⁴ = 10,000: −2135 → −0.2135 and 513 → 0.0513. (Dividing by 1000 would give −2.135, outside [−1, 1].)</div>
<p><b>Problem:</b> values between 100 and 200 → between 0.1 and 0.2: everything is squeezed into a tiny interval.</p></div>
<div class="panel"><h3>Min-max (slide 61)</h3><div class="formula">v′ = ${FR("v − min(v)","max(v) − min(v)")}</div>
<p>Result in [0, 1]. Min and max are found or given by an expert: use the <b>true</b> values. Variants map to [−1, 1].</p></div>
<div class="panel"><h3>Standard deviation (slide 62)</h3><div class="formula">v* = ${FR("v − mean(v)","std(v)")}</div>
<p>Works well with distance measures; makes the data unrecognizable.</p></div>
<div class="panel"><h3>Smoothing (slides 64–66)</h3><ul>
<li>Some variables have almost as many distinct values as records; these small differences can hurt some models.</li>
<li>Simple smoothing: reals → integers (e.g. 7 values → 4) with no real loss of quality.</li></ul>
<div class="formula">SMA = ${FR("A<sub>1</sub> + A<sub>2</sub> + … + A<sub>n</sub>","n")}</div>
<p>A<sub>i</sub> = value for period i, n = number of periods.</p></div>`},
manq:{
fr:`<div class="panel"><h3>Le problème</h3><ul>
<li>Souvent une grande partie du dataset ; les données futures peuvent aussi en avoir.</li>
<li><b>Acceptent</b> les manquantes : arbres de décision, k-ppv, SVM.</li>
<li><b>N’acceptent pas</b> : régression linéaire et logistique, k-means, réseaux de neurones.</li></ul></div>
<div class="panel"><h3>Solutions, de la plus simple à la plus complexe</h3><div class="tbl"><table>
<tr><th>Niveau</th><th>Solution</th><th>Limite</th></tr>
<tr><td>Meilleure</td><td>Avec l’expert : saisir des valeurs raisonnables</td><td>Seulement si peu de manquantes</td></tr>
<tr><td>Plus facile</td><td>Supprimer les enregistrements</td><td>Incohérent si les manquantes sont nombreuses</td></tr>
<tr><td>Moins complexes</td><td>Constante globale · moyenne de l’attribut · moyenne de la même classe</td><td>Données <b>biaisées</b> : le modèle se base sur cette valeur</td></tr>
<tr><td>Plus complexes</td><td>Remplacer par <b>toutes les valeurs possibles</b> → enregistrements artificiels (ex. statut « ? » → 4 lignes)</td><td>Trop de valeurs possibles ; attributs continus</td></tr>
<tr><td>Encore plus complexes</td><td><b>Modèle prédictif</b> : la colonne manquante devient la cible (régression, arbres, k-means, k-ppv) puis on réinsère</td><td>Peut se tromper, mais plus robuste (plus d’information)</td></tr></table></div>
<div class="callout tip"><b>Conseil du cours :</b> tester plusieurs techniques, puis analyser et interpréter les résultats.</div></div>`,
en:`<div class="panel"><h3>The problem</h3><ul>
<li>Often a large part of the dataset; future data can have missing values too.</li>
<li><b>Accept</b> missing values: decision trees, k-NN, SVM.</li>
<li><b>Do not accept</b>: linear and logistic regression, k-means, neural networks.</li></ul></div>
<div class="panel"><h3>Solutions, from simplest to most complex</h3><div class="tbl"><table>
<tr><th>Level</th><th>Solution</th><th>Limit</th></tr>
<tr><td>Best</td><td>With the expert: enter reasonable values</td><td>Only if few are missing</td></tr>
<tr><td>Easiest</td><td>Delete the records</td><td>Inconsistent if many are missing</td></tr>
<tr><td>Less complex</td><td>Global constant · attribute mean · mean of the same class</td><td><b>Biased</b> data: the model relies on that value</td></tr>
<tr><td>More complex</td><td>Replace with <b>all possible values</b> → artificial records (e.g. status “?” → 4 rows)</td><td>Too many possible values; continuous attributes</td></tr>
<tr><td>Even more complex</td><td><b>Predictive model</b>: the missing column becomes the target (regression, trees, k-means, k-NN), then reinsert</td><td>Can be wrong, but more robust (more information)</td></tr></table></div>
<div class="callout tip"><b>Course advice:</b> try several techniques, then analyze and interpret the results.</div></div>`},
reg:{
fr:`<div class="panel"><h3>Généralités</h3><ul>
<li>Première forme : <b>1805</b>, moindres carrés, <b>Legendre</b>.</li>
<li>Modélise la relation entre une variable <b>dépendante</b> (à prédire) et une ou plusieurs <b>indépendantes</b> (explicatives).</li>
<li>Méthodes : linéaire simple, multiple, polynomiale, logistique, logistique multinomiale, Poisson, non linéaire, bayésienne. Le cours traite la <b>simple</b> et la <b>multiple</b>.</li></ul></div>
<div class="panel"><h3>Régression linéaire simple</h3>
<div class="formula">y<sub>i</sub> = a·x<sub>i</sub> + b + ε<sub>i</sub></div>
<p>a = pente, b = ordonnée à l’origine, ε = erreur (réel − prédit). But : la droite qui minimise la somme des erreurs au carré.</p>
<div class="formula">a = ${FR("Σ (x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)","Σ (x<sub>i</sub> − x̄)²")} &nbsp;&nbsp; b = ȳ − a·x̄</div>
<p class="eyebrow">Exemple du cours (diapos 90–94) : publicité x → revenus y (M DA)</p>
<div class="tbl"><table><tr><th>x</th><td>10</td><td>14</td><td>18</td><td>25</td><td>29</td><td>34</td></tr><tr><th>y</th><td>20</td><td>23</td><td>39</td><td>42</td><td>51</td><td>63</td></tr></table></div>
<p>x̄ = 21,67 · ȳ = 39,67 · Σ(x−x̄)(y−ȳ) = 738,33 · Σ(x−x̄)² = 425,33 → <b>a = 1,74 ; b = 2,06</b> → ŷ = 1,74x + 2,06</p>
<div class="callout tip"><b>Labo :</b> refais tout le tableau pas à pas dans Labos → Régression simple.</div></div>
<div class="panel"><h3>Régression linéaire multiple</h3>
<div class="formula">y<sub>i</sub> = a<sub>0</sub> + a<sub>1</sub>x<sub>i,1</sub> + … + a<sub>p</sub>x<sub>i,p</sub> + ε<sub>i</sub> &nbsp;&nbsp; â = (X′X)<sup>−1</sup>X′Y</div>
<p class="eyebrow">Méthode en 4 étapes (diapos 101–105)</p>
<ol><li>Séparer X et Y ; ajouter à X une colonne de 1 (« constante »)</li><li>Calculer X′ (transposée) puis X′X</li><li>Calculer (X′X)⁻¹</li><li>Calculer X′Y puis â = (X′X)⁻¹X′Y</li></ol>
<p>Exemple livraisons (10 trajets) : X′X = [[10, 1281, 31], [1281, 173405, 4413], [31, 4413, 119]], X′Y = [63,9 ; 8418,9 ; 209,5]</p>
<div class="formula">Temps = 3,70 + 0,02 × distance + 0,17 × nbLivraisons</div>
<div class="callout"><b>Précision :</b> le coefficient exact de la distance est 0,0168 (arrondi à 0,02 sur la diapo). Si on te demande une prédiction, utilise la valeur donnée dans l’énoncé.</div></div>`,
en:`<div class="panel"><h3>Overview</h3><ul>
<li>First form: <b>1805</b>, least squares, <b>Legendre</b>.</li>
<li>Models the relation between a <b>dependent</b> variable (to predict) and one or more <b>independent</b> (explanatory) variables.</li>
<li>Methods: simple linear, multiple, polynomial, logistic, multinomial logistic, Poisson, non-linear, Bayesian. The course covers <b>simple</b> and <b>multiple</b>.</li></ul></div>
<div class="panel"><h3>Simple linear regression</h3>
<div class="formula">y<sub>i</sub> = a·x<sub>i</sub> + b + ε<sub>i</sub></div>
<p>a = slope, b = intercept, ε = error (actual − predicted). Goal: the line that minimizes the sum of squared errors.</p>
<div class="formula">a = ${FR("Σ (x<sub>i</sub> − x̄)(y<sub>i</sub> − ȳ)","Σ (x<sub>i</sub> − x̄)²")} &nbsp;&nbsp; b = ȳ − a·x̄</div>
<p class="eyebrow">Course example (slides 90–94): advertising x → revenue y (M DA)</p>
<div class="tbl"><table><tr><th>x</th><td>10</td><td>14</td><td>18</td><td>25</td><td>29</td><td>34</td></tr><tr><th>y</th><td>20</td><td>23</td><td>39</td><td>42</td><td>51</td><td>63</td></tr></table></div>
<p>x̄ = 21.67 · ȳ = 39.67 · Σ(x−x̄)(y−ȳ) = 738.33 · Σ(x−x̄)² = 425.33 → <b>a = 1.74; b = 2.06</b> → ŷ = 1.74x + 2.06</p>
<div class="callout tip"><b>Lab:</b> redo the whole table step by step in Labs → Simple regression.</div></div>
<div class="panel"><h3>Multiple linear regression</h3>
<div class="formula">y<sub>i</sub> = a<sub>0</sub> + a<sub>1</sub>x<sub>i,1</sub> + … + a<sub>p</sub>x<sub>i,p</sub> + ε<sub>i</sub> &nbsp;&nbsp; â = (X′X)<sup>−1</sup>X′Y</div>
<p class="eyebrow">4-step method (slides 101–105)</p>
<ol><li>Split X and Y; add a column of 1s (“constant”) to X</li><li>Compute X′ (transpose), then X′X</li><li>Compute (X′X)⁻¹</li><li>Compute X′Y, then â = (X′X)⁻¹X′Y</li></ol>
<p>Delivery example (10 trips): X′X = [[10, 1281, 31], [1281, 173405, 4413], [31, 4413, 119]], X′Y = [63.9; 8418.9; 209.5]</p>
<div class="formula">Time = 3.70 + 0.02 × distance + 0.17 × nbDeliveries</div>
<div class="callout"><b>Note:</b> the exact distance coefficient is 0.0168 (rounded to 0.02 on the slide). If asked for a prediction, use the value given in the question.</div></div>`},
arbres:{
fr:`<div class="panel"><h3>Principe</h3><ul>
<li>Parcours depuis la <b>racine</b> ; chaque nœud = une <b>décision atomique</b> (test sur un attribut) ; chaque réponse mène à un fils ; une <b>feuille</b> = la réponse.</li>
<li>Exemple : l’ami vient-il faire du footing ? Attributs Ciel, Température, Humidité, Vent (14 enregistrements, 9 Oui / 5 Non).</li></ul></div>
<div class="panel"><h3>ID3</h3>
<div class="formula">${ENT("Entropie")}</div>
<div class="formula">I(A) = Σ ${FR("p<sub>i</sub>+n<sub>i</sub>","p+n")} × Entropie(A=v<sub>i</sub>) &nbsp;&nbsp; Gain(A) = Entropie(S) − I(A)</div>
<ol><li>Calculer l’entropie du dataset</li><li>Pour chaque attribut : entropie de chaque valeur → moyenne d’information I → gain</li><li>Choisir l’attribut au plus grand gain</li><li>Répéter sur chaque sous-ensemble jusqu’à obtenir l’arbre</li></ol></div>
<div class="panel"><h3>Résultats de l’exemple (à connaître)</h3>
<p>Entropie(S) = Entropie(9, 5) = <b>0,94</b></p>
<div class="tbl"><table><tr><th>Attribut</th><th>Détail (p/n → entropie)</th><th>I</th><th>Gain</th></tr>
<tr><td><b>Ciel</b></td><td>Ensoleillé 2/3 → 0,971 · Pluvieux 3/2 → 0,971 · Couvert 4/0 → 0</td><td>0,693</td><td><b>0,247</b></td></tr>
<tr><td>Humidité</td><td>Élevée 3/4 → 0,985 · Normale 6/1 → 0,591</td><td>0,788</td><td>0,152</td></tr>
<tr><td>Vent</td><td>Faible 6/2 → 0,811 · Fort 3/3 → 1</td><td>0,892</td><td>0,048</td></tr>
<tr><td>Température</td><td>Élevée 2/2 → 1 · Moyenne 4/2 → 0,918 · Basse 3/1 → 0,811</td><td>0,911</td><td>0,029</td></tr></table></div>
<p>Sous Ensoleillé : Humidité 0,971 · Température 0,571 · Vent 0,02 → <b>Humidité</b>. Sous Pluvieux : Vent 0,971 · Humidité 0,02 · Température 0,02 → <b>Vent</b>.</p>
<div class="callout tip"><b>Arbre final :</b> Ciel = Couvert → Oui · Ensoleillé → Humidité (Élevée → Non, Normale → Oui) · Pluvieux → Vent (Faible → Oui, Fort → Non). La température n’apparaît pas.</div></div>`,
en:`<div class="panel"><h3>Principle</h3><ul>
<li>Traverse from the <b>root</b>; each node = an <b>atomic decision</b> (a test on an attribute); each answer leads to a child; a <b>leaf</b> = the answer.</li>
<li>Example: will my friend come jogging? Attributes Sky (Ciel), Temperature, Humidity, Wind (Vent) — 14 records, 9 Yes / 5 No.</li>
<li>Value names (kept in French in the labs): Ensoleillé = Sunny, Couvert = Overcast, Pluvieux = Rainy, Elevée = High, Moyenne = Mild, Basse = Cool, Normale = Normal, Faible = Weak, Fort = Strong, Oui/Non = Yes/No.</li></ul></div>
<div class="panel"><h3>ID3</h3>
<div class="formula">${ENT("Entropy")}</div>
<div class="formula">I(A) = Σ ${FR("p<sub>i</sub>+n<sub>i</sub>","p+n")} × Entropy(A=v<sub>i</sub>) &nbsp;&nbsp; Gain(A) = Entropy(S) − I(A)</div>
<ol><li>Compute the dataset entropy</li><li>For each attribute: entropy of each value → average information I → gain</li><li>Pick the attribute with the highest gain</li><li>Repeat on each subset until the tree is built</li></ol></div>
<div class="panel"><h3>Example results (learn these)</h3>
<p>Entropy(S) = Entropy(9, 5) = <b>0.94</b></p>
<div class="tbl"><table><tr><th>Attribute</th><th>Detail (p/n → entropy)</th><th>I</th><th>Gain</th></tr>
<tr><td><b>Sky</b></td><td>Sunny 2/3 → 0.971 · Rainy 3/2 → 0.971 · Overcast 4/0 → 0</td><td>0.693</td><td><b>0.247</b></td></tr>
<tr><td>Humidity</td><td>High 3/4 → 0.985 · Normal 6/1 → 0.591</td><td>0.788</td><td>0.152</td></tr>
<tr><td>Wind</td><td>Weak 6/2 → 0.811 · Strong 3/3 → 1</td><td>0.892</td><td>0.048</td></tr>
<tr><td>Temperature</td><td>High 2/2 → 1 · Mild 4/2 → 0.918 · Cool 3/1 → 0.811</td><td>0.911</td><td>0.029</td></tr></table></div>
<p>Under Sunny: Humidity 0.971 · Temperature 0.571 · Wind 0.02 → <b>Humidity</b>. Under Rainy: Wind 0.971 · Humidity 0.02 · Temperature 0.02 → <b>Wind</b>.</p>
<div class="callout tip"><b>Final tree:</b> Sky = Overcast → Yes · Sunny → Humidity (High → No, Normal → Yes) · Rainy → Wind (Weak → Yes, Strong → No). Temperature does not appear.</div></div>`},
rna:{
fr:`<div class="panel"><h3>Principe</h3><ul>
<li>Modèle de calcul inspiré du cerveau ; ensemble fini de neurones (unités de calcul) en réseau ; l’information se propage de <i>in</i> vers <i>out</i>.</li>
<li>Couches : <b>entrée</b> (sensorielle) → <b>cachées</b> (une ou plusieurs) → <b>sortie</b>. Connexions = <b>synapses</b> (activatrices ou inhibitrices).</li>
<li>Activation selon : coefficient de la synapse, intensité du signal → <b>fonction d’activation</b>. On compare les signaux activateurs/inhibiteurs et on ajoute le <b>biais</b>.</li>
<li><b>ReLU</b> : activation si x &gt; 0. <b>Sigmoïde</b> : activation graduelle, 1/(1+e⁻ˣ).</li>
<li>Paramétrage (boîte noire) : nb de couches cachées, neurones par couche, fonction d’activation, taux d’apprentissage, itérations et taux d’erreur visés.</li></ul></div>
<div class="panel"><h3>Exemple boîte blanche (diapos 160–165)</h3>
<p>Entrées : poids = 65, taille = 1,60. Sorties : Adulte (cible 1), Enfant (cible 0). Réseau 2-3-2, sigmoïde.</p>
<div class="tbl"><table><tr><th>Nœud</th><th>net</th><th>out</th></tr>
<tr><td>h1</td><td>65×0,2 + 1,6×0,23 + 0,6 = 13,968</td><td>≈ 1</td></tr>
<tr><td>h2</td><td>65×0,31 + 1,6×0,43 + 0,4 = 21,238</td><td>≈ 1</td></tr>
<tr><td>h3</td><td>65×0,35 + 1,6×0,5 + 0,2 = 23,750</td><td>≈ 1</td></tr>
<tr><td>o1 (Adulte)</td><td>0,15 + 0,25 + 0,17 + 0,25 = 0,82</td><td>0,694</td></tr>
<tr><td>o2 (Enfant)</td><td>0,34 + 0,09 + 0,28 + 0,2 = 0,91</td><td>0,713</td></tr></table></div>
<div class="formula">E = ½(0,694 − 1)² + ½(0,713 − 0)² ≈ 0,0468 + 0,2542 ≈ 0,301</div>
<div class="callout"><b>Piège :</b> la diapo 162 écrit ½×(0,694−1) + ½×(0,713−0) sans les carrés. La formule correcte est avec le carré.</div>
<div class="formula">∂E/∂w₇ = (0,694 − 1) × 0,694 × (1 − 0,694) × 1 ≈ −0,065 &nbsp;→&nbsp; w₇⁺ = 0,15 − η × (−0,065)</div>
<p>Poids : w₁=0,2 w₄=0,23 (vers h1) · w₂=0,31 w₅=0,43 (h2) · w₃=0,35 w₆=0,5 (h3) · w₇=0,15 w₉=0,25 w₁₁=0,17 (vers o1) · w₈=0,34 w₁₀=0,09 w₁₂=0,28 (vers o2).</p>
<div class="callout tip"><b>Labo :</b> Labos → Réseau de neurones fait la propagation et la mise à jour de w₇ en direct.</div></div>`,
en:`<div class="panel"><h3>Principle</h3><ul>
<li>A computing model inspired by the brain; a finite set of neurons (computing units) in a network; information flows from <i>in</i> to <i>out</i>.</li>
<li>Layers: <b>input</b> (sensory) → <b>hidden</b> (one or more) → <b>output</b>. Connections = <b>synapses</b> (excitatory or inhibitory).</li>
<li>Activation depends on the synapse coefficient and the signal strength → the <b>activation function</b>. Excitatory/inhibitory signals are summed and the <b>bias</b> is added.</li>
<li><b>ReLU</b>: activates if x &gt; 0. <b>Sigmoid</b>: gradual activation, 1/(1+e⁻ˣ).</li>
<li>Settings (black box): number of hidden layers, neurons per layer, activation function, learning rate, iterations and target error rate.</li></ul></div>
<div class="panel"><h3>White-box example (slides 160–165)</h3>
<p>Inputs: weight = 65, height = 1.60. Outputs: Adult (target 1), Child (target 0). A 2-3-2 network, sigmoid.</p>
<div class="tbl"><table><tr><th>Node</th><th>net</th><th>out</th></tr>
<tr><td>h1</td><td>65×0.2 + 1.6×0.23 + 0.6 = 13.968</td><td>≈ 1</td></tr>
<tr><td>h2</td><td>65×0.31 + 1.6×0.43 + 0.4 = 21.238</td><td>≈ 1</td></tr>
<tr><td>h3</td><td>65×0.35 + 1.6×0.5 + 0.2 = 23.750</td><td>≈ 1</td></tr>
<tr><td>o1 (Adult)</td><td>0.15 + 0.25 + 0.17 + 0.25 = 0.82</td><td>0.694</td></tr>
<tr><td>o2 (Child)</td><td>0.34 + 0.09 + 0.28 + 0.2 = 0.91</td><td>0.713</td></tr></table></div>
<div class="formula">E = ½(0.694 − 1)² + ½(0.713 − 0)² ≈ 0.0468 + 0.2542 ≈ 0.301</div>
<div class="callout"><b>Trap:</b> slide 162 writes ½×(0.694−1) + ½×(0.713−0) without the squares. The correct formula has the square.</div>
<div class="formula">∂E/∂w₇ = (0.694 − 1) × 0.694 × (1 − 0.694) × 1 ≈ −0.065 &nbsp;→&nbsp; w₇⁺ = 0.15 − η × (−0.065)</div>

const fr=(x,d=3)=>{if(!isFinite(x))return "—";return Number(x.toFixed(d)).toLocaleString(LANG==="en"?"en-US":"fr-FR",{maximumFractionDigits:d});};
const log2=x=>x<=0?0:Math.log2(x);
const H=(p,n)=>{const t=p+n;if(!t||!p||!n)return 0;return -(p/t)*log2(p/t)-(n/t)*log2(n/t);};
const sig=x=>1/(1+Math.exp(-x));

function startQuiz(o){

  renderQuestion();
}

  const t=$("#qTimer"); if(t){t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;t.classList.toggle("low",left<60);}

}

  </div>
  ${wrongs.length?`<div class="panel review"><h3>${L("À revoir","To review")}</h3>${wrongs.map(w=>{const q=Q[w.id];const t=qx(w.id);return `<div class="item"><div class="row"><span class="tag">${chName(q[0])}</span><span class="tag ore">${L("Diapo","Slide")} ${q[1]}</span></div><b>${t.q}</b>${w.a===undefined?`<span class="yours">${L("Pas de réponse (temps écoulé)","No answer (time ran out)")}</span>`:`<span class="yours">${L("Ta réponse","Your answer")}${COL}${t.o[w.a]}</span>`}<span class="good">${L("Bonne réponse","Correct answer")}${COL}${t.o[0]}</span><span style="color:var(--muted)">${t.e}</span></div>`;}).join("")}</div>`:""}`;

const ORDERS={
  kdd:{t:"Processus d’ECD (diapo 17)",te:"KDD process (slide 17)",items:["Sélection des données","Prétraitement","Transformation","Fouille de données","Interprétation et évaluation"],en:["Data selection","Preprocessing","Transformation","Data mining","Interpretation and evaluation"]},
  crisp:{t:"Phases de CRISP-DM (diapo 20)",te:"CRISP-DM phases (slide 20)",items:["Compréhension du métier","Compréhension des données","Préparation des données","Modélisation","Évaluation","Déploiement"],en:["Business understanding","Data understanding","Data preparation","Modeling","Evaluation","Deployment"]},
  semma:{t:"SEMMA (diapo 19)",te:"SEMMA (slide 19)",items:["Sample","Explore","Modify","Model","Assess"],en:["Sample","Explore","Modify","Model","Assess"]},
  id3:{t:"Étapes d’ID3 (diapo 117)",te:"ID3 steps (slide 117)",items:["Entropie du dataset","Entropie de chaque valeur de l’attribut","Moyenne d’information I(attribut)","Gain de l’attribut","Choisir le plus grand gain","Répéter sur les sous-ensembles"],en:["Dataset entropy","Entropy of each attribute value","Average information I(attribute)","Attribute gain","Pick the highest gain","Repeat on the subsets"]},
  kdd6:{t:"Les 6 étapes détaillées du KDD (diapos 26–31)",te:"The 6 detailed KDD steps (slides 26–31)",items:["Définition et compréhension du problème","Collecte des données","Prétraitement","Transformation","Data mining (modèle)","Interprétation"],en:["Problem definition and understanding","Data collection","Preprocessing","Transformation","Data mining (model)","Interpretation"]},
};
const GEN={
  entropie:{t:"Entropie",te:"Entropy",f(){const p=rnd(1,9),n=rnd(1,9),t=p+n,a=H(p,n);return{q:L(`Un nœud contient <b>${p} Oui</b> et <b>${n} Non</b>. Calcule son entropie.`,`A node holds <b>${p} Yes</b> and <b>${n} No</b>. Compute its entropy.`),a,steps:`<div class="formula">${L("Entropie","Entropy")} = −${FR(p,t)}log<sub>2</sub>${FR(p,t)} − ${FR(n,t)}log<sub>2</sub>${FR(n,t)}</div><p>= −${fr(p/t,4)} × (${fr(log2(p/t),4)}) − ${fr(n/t,4)} × (${fr(log2(n/t),4)}) = <b>${fr(a,3)}</b></p>`};}},
  gain:{t:"Gain d’information",te:"Information gain",f(){let k=rnd(2,3);let parts=[];let P=0,N=0;for(let i=0;i<k;i++){const p=rnd(0,5),n=rnd(0,5)||(p?0:1);parts.push([p,n]);P+=p;N+=n;}if(!P||!N){parts[0][0]++;parts[k-1][1]++;P=parts.reduce((s,x)=>s+x[0],0);N=parts.reduce((s,x)=>s+x[1],0);}
    const T=P+N,HS=H(P,N),I=parts.reduce((s,[p,n])=>s+(p+n)/T*H(p,n),0),g=HS-I;const names=["A","B","C"];const Y=L("Oui","Yes"),No=L("Non","No"),E=L("Entropie","Entropy");
    return{q:L(`Dataset : <b>${P} Oui / ${N} Non</b>. L’attribut X a ${k} valeurs : `,`Dataset: <b>${P} Yes / ${N} No</b>. Attribute X has ${k} values: `)+parts.map(([p,n],i)=>`X=${names[i]} → ${p} ${Y} / ${n} ${No}`).join(" · ")+L(`. Calcule <b>Gain(X)</b>.`,`. Compute <b>Gain(X)</b>.`),a:g,
    steps:`<p>${E}(S) = ${E}(${P}, ${N}) = ${fr(HS,4)}</p>${parts.map(([p,n],i)=>`<p>${E}(X=${names[i]}) = ${E}(${p}, ${n}) = ${fr(H(p,n),4)}</p>`).join("")}<p>I(X) = ${parts.map(([p,n])=>`${p+n}/${T} × ${fr(H(p,n),3)}`).join(" + ")} = ${fr(I,4)}</p><p>Gain = ${fr(HS,4)} − ${fr(I,4)} = <b>${fr(g,3)}</b></p>`};}},
  minmax:{t:"Min-max",te:"Min-max",f(){const vals=Array.from({length:6},()=>rnd(5,120));const v=vals[rnd(0,5)];const mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx)return GEN.minmax.f();const a=(v-mn)/(mx-mn);return{q:L(`Colonne : ${vals.join(", ")}. Normalise la valeur <b>${v}</b> par min-max.`,`Column: ${vals.join(", ")}. Min-max normalize the value <b>${v}</b>.`),a,steps:`<div class="formula">v′ = ${FR(`${v} − ${mn}`,`${mx} − ${mn}`)} = ${FR(v-mn,mx-mn)} = <b>${fr(a,3)}</b></div>`};}},
  zscore:{t:"Écart type (z-score)",te:"Standard deviation (z-score)",f(){const vals=Array.from({length:5},()=>rnd(2,20));const v=vals[rnd(0,4)];const m=vals.reduce((a,b)=>a+b,0)/5;const ss=vals.reduce((s,x)=>s+(x-m)**2,0);const sd=Math.sqrt(ss/5);if(!sd)return GEN.zscore.f();const a=(v-m)/sd;
    return{q:L(`Valeurs : ${vals.join(", ")}. Normalise <b>${v}</b> par écart type. (Écart type de population, division par n.)`,`Values: ${vals.join(", ")}. Normalize <b>${v}</b> with the standard deviation. (Population std, divide by n.)`),a,steps:`<p>${L("Moyenne","Mean")} = (${vals.join(" + ")}) / 5 = ${fr(m,3)}</p><p>Variance = Σ(v − ${L("moyenne","mean")})² / 5 = ${fr(ss/5,3)} → ${L("écart type","std")} = ${fr(sd,4)}</p><div class="formula">v* = ${FR(`${v} − ${fr(m,3)}`,fr(sd,4))} = <b>${fr(a,3)}</b></div><p style="color:var(--muted);font-size:.85rem">${L("Avec l’écart type corrigé (n − 1), on trouverait","With the corrected std (n − 1), you would get")} ${fr((v-m)/Math.sqrt(ss/4),3)}.</p>`};}},
  decimal:{t:"Mise à l’échelle décimale",te:"Decimal scaling",f(){const vals=Array.from({length:5},()=>rnd(-4999,4999)).map(x=>x===0?7:x);const mx=Math.max(...vals.map(Math.abs));const k=String(mx).length;const v=vals[rnd(0,4)];const a=v/10**k;
    return{q:L(`Colonne : ${vals.join(" ; ")}. Normalise <b>${v}</b> par mise à l’échelle décimale.`,`Column: ${vals.join("; ")}. Normalize <b>${v}</b> with decimal scaling.`),a,steps:`<p>max|v| = ${mx} (${k} ${L("chiffres","digits")}) → k = ${k}</p><div class="formula">v′ = ${FR(v,`10<sup>${k}</sup>`)} = <b>${fr(a,4)}</b></div>`};}},
  mms:{t:"Moyenne mobile simple",te:"Simple moving average",f(){const vals=Array.from({length:6},()=>rnd(10,60));const a=(vals[3]+vals[4]+vals[5])/3;return{q:L(`Ventes sur 6 mois : ${vals.join(", ")}. Calcule la moyenne mobile simple sur les <b>3 derniers mois</b>.`,`Sales over 6 months: ${vals.join(", ")}. Compute the simple moving average over the <b>last 3 months</b>.`),a,steps:`<div class="formula">${L("MMS","SMA")} = ${FR(`${vals[3]} + ${vals[4]} + ${vals[5]}`,3)} = <b>${fr(a,3)}</b></div>`};}},
  rega:{t:"Régression : pente a",te:"Regression: slope a",f(){const pts=genPts();const r=linreg(pts);return{q:L(`Points (x, y) : `,`Points (x, y): `)+pts.map(p=>`(${p[0]}, ${p[1]})`).join(" ")+L(`. Calcule la pente <b>a</b> de la droite des moindres carrés.`,`. Compute the slope <b>a</b> of the least-squares line.`),a:r.a,steps:regSteps(pts,r)};}},
  regb:{t:"Régression : ordonnée b",te:"Regression: intercept b",f(){const pts=genPts();const r=linreg(pts);return{q:L(`Points (x, y) : `,`Points (x, y): `)+pts.map(p=>`(${p[0]}, ${p[1]})`).join(" ")+L(`. Calcule l’ordonnée à l’origine <b>b</b>.`,`. Compute the intercept <b>b</b>.`),a:r.b,steps:regSteps(pts,r)};}},
  sigmoid:{t:"Neurone sigmoïde",te:"Sigmoid neuron",f(){const x1=rnd(1,9)/10,x2=rnd(1,9)/10,w1=rnd(-9,9)/10,w2=rnd(-9,9)/10,b=rnd(-5,5)/10;const net=x1*w1+x2*w2+b;const a=sig(net);
    return{q:L(`Un neurone reçoit x₁ = ${fr(x1,1)}, x₂ = ${fr(x2,1)} avec w₁ = ${fr(w1,1)}, w₂ = ${fr(w2,1)} et un biais de ${fr(b,1)}. Calcule sa sortie avec la sigmoïde.`,`A neuron receives x₁ = ${fr(x1,1)}, x₂ = ${fr(x2,1)} with w₁ = ${fr(w1,1)}, w₂ = ${fr(w2,1)} and a bias of ${fr(b,1)}. Compute its sigmoid output.`),a,steps:`<p>net = ${fr(x1,1)}×${fr(w1,1)} + ${fr(x2,1)}×${fr(w2,1)} + ${fr(b,1)} = ${fr(net,3)}</p><div class="formula">out = ${FR(1,`1 + e<sup>−(${fr(net,3)})</sup>`)} = <b>${fr(a,3)}</b></div>`};}},
  erreur:{t:"Erreur totale",te:"Total error",f(){const o1=rnd(30,95)/100,o2=rnd(5,80)/100;const a=.5*(o1-1)**2+.5*o2**2;return{q:L(`Sorties du réseau : o₁ = ${fr(o1,2)} (cible 1) et o₂ = ${fr(o2,2)} (cible 0). Calcule E<sub>totale</sub>.`,`Network outputs: o₁ = ${fr(o1,2)} (target 1) and o₂ = ${fr(o2,2)} (target 0). Compute E<sub>total</sub>.`),a,steps:`<div class="formula">E = ½(${fr(o1,2)} − 1)² + ½(${fr(o2,2)} − 0)² = ${fr(.5*(o1-1)**2,4)} + ${fr(.5*o2**2,4)} = <b>${fr(a,4)}</b></div>`};}},
  update:{t:"Mise à jour d’un poids",te:"Weight update",f(){const o=rnd(30,90)/100,t=rnd(0,1),h=rnd(50,99)/100,w=rnd(5,60)/100,eta=[0.1,0.25,0.5,1][rnd(0,3)];const g=(o-t)*o*(1-o)*h;const a=w-eta*g;
    return{q:L(`Sortie o₁ = ${fr(o,2)}, cible ${t}, out<sub>h1</sub> = ${fr(h,2)}, w₇ = ${fr(w,2)}, η = ${fr(eta,2)}. Calcule <b>w₇⁺</b> (sigmoïde, E = Σ½(o − cible)²).`,`Output o₁ = ${fr(o,2)}, target ${t}, out<sub>h1</sub> = ${fr(h,2)}, w₇ = ${fr(w,2)}, η = ${fr(eta,2)}. Compute <b>w₇⁺</b> (sigmoid, E = Σ½(o − target)²).`),a,steps:`<p>∂E/∂out = ${fr(o,2)} − ${t} = ${fr(o-t,3)}</p><p>∂out/∂net = out(1 − out) = ${fr(o,2)} × ${fr(1-o,2)} = ${fr(o*(1-o),4)}</p><p>∂net/∂w₇ = out<sub>h1</sub> = ${fr(h,2)}</p><p>∂E/∂w₇ = ${fr(g,4)}</p><div class="formula">w₇⁺ = ${fr(w,2)} − ${fr(eta,2)} × (${fr(g,4)}) = <b>${fr(a,4)}</b></div>`};}},
};
function genPts(){const a=rnd(5,25)/10,b=rnd(-5,10);const xs=shuffle([1,2,3,4,5,6,7,8]).slice(0,4).sort((x,y)=>x-y);return xs.map(x=>[x,Math.round(a*x+b+rnd(-2,2))]);}
function linreg(pts){const n=pts.length,mx=pts.reduce((s,p)=>s+p[0],0)/n,my=pts.reduce((s,p)=>s+p[1],0)/n;let sxy=0,sxx=0;pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;});const a=sxx?sxy/sxx:0;return{a,b:my-a*mx,mx,my,sxy,sxx};}
function regSteps(pts,r){return `<p>x̄ = ${fr(r.mx,3)} · ȳ = ${fr(r.my,3)}</p><div class="tbl"><table class="dtable"><tr><th>x</th><th>y</th><th class="num">x−x̄</th><th class="num">y−ȳ</th><th class="num">(x−x̄)(y−ȳ)</th><th class="num">(x−x̄)²</th></tr>${pts.map(([x,y])=>`<tr><td>${x}</td><td>${y}</td><td class="num">${fr(x-r.mx,2)}</td><td class="num">${fr(y-r.my,2)}</td><td class="num">${fr((x-r.mx)*(y-r.my),2)}</td><td class="num">${fr((x-r.mx)**2,2)}</td></tr>`).join("")}<tfoot><tr><td colspan="4">${L("Somme","Sum")}</td><td class="num">${fr(r.sxy,2)}</td><td class="num">${fr(r.sxx,2)}</td></tr></tfoot></table></div><p>a = ${fr(r.sxy,3)} / ${fr(r.sxx,3)} = <b>${fr(r.a,3)}</b> · b = ${fr(r.my,3)} − ${fr(r.a,3)} × ${fr(r.mx,3)} = <b>${fr(r.b,3)}</b></p>`;}

let EX={type:"mix",cur:null,checked:false};
const streakTxt=()=>L(`Série : ${S.streak} · record ${S.best}`,`Streak: ${S.streak} · best ${S.best}`);
RENDER.exercices=function(){
  const el=$("#v-exercices");
  el.innerHTML=`<div><p class="eyebrow">${L("Exercices","Exercises")}</p><h2>${L("Calculs type examen, générés à l’infini","Exam-style calculations, endlessly generated")}</h2><p class="lede">${L("Chaque exercice a de nouvelles valeurs. Tolérance de ±0,01 sur la réponse. Les étapes de la correction suivent les formules du cours.","Every exercise gets new numbers. Answers within ±0.01 count. The worked solution follows the course formulas.")}</p></div>
  <div class="row"><button class="chip" data-t="mix" aria-pressed="${EX.type==="mix"}">${L("Mélange","Mixed")}</button>${Object.entries(GEN).map(([k,g])=>`<button class="chip" data-t="${k}" aria-pressed="${EX.type===k}">${L(g.t,g.te)}</button>`).join("")}<button class="chip" data-t="order" aria-pressed="${EX.type==="order"}">${L("Remettre dans l’ordre","Put in order")}</button></div>
  <div class="panel exo-out" id="exo"></div>`;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{EX.type=b.dataset.t;el.querySelectorAll("[data-t]").forEach(x=>x.setAttribute("aria-pressed",x===b));newExo();});

function newExo(){
  let t=EX.type;
  if(t==="mix"){const keys=[...Object.keys(GEN),"order","order"];t=keys[rnd(0,keys.length-1)];}
  if(t==="order")return newOrder();
  const g=GEN[t]; EX.cur=g.f(); EX.checked=false;
  $("#exo").innerHTML=`<div class="row" style="justify-content:space-between"><span class="tag">${L(g.t,g.te)}</span><span class="streak">${streakTxt()}</span></div>
  <p class="qtext" style="font-size:1.05rem">${EX.cur.q}</p>
  <form class="answer-row" id="exForm"><input type="text" inputmode="decimal" id="exIn" placeholder="${L("ta réponse","your answer")}" autocomplete="off" aria-label="${L("Ta réponse","Your answer")}"><button class="btn primary" type="submit">${L("Vérifier","Check")}</button><button class="btn" type="button" id="exShow">${L("Voir la correction","Show solution")}</button><button class="btn ghost" type="button" id="exNew">${L("Nouvel exercice","New exercise")} →</button></form>
  <div id="exRes"></div>`;
  $("#exForm").onsubmit=e=>{e.preventDefault();checkExo();};
  $("#exShow").onclick=()=>revealExo(null);
  $("#exNew").onclick=newExo;
  $("#exIn").focus({preventScroll:true});
}
function checkExo(){
  const v=parseNum($("#exIn").value); if(isNaN(v))return;
  const a=EX.cur.a; const ok=Math.abs(v-a)<=Math.max(0.011,Math.abs(a)*0.005);
  if(!EX.checked){ if(ok){S.streak++;S.best=Math.max(S.best,S.streak);} else S.streak=0; save(); EX.checked=true; }
  revealExo(ok);
}
function revealExo(ok){
  if(ok===null&&!EX.checked){S.streak=0;save();EX.checked=true;}
  $("#exRes").innerHTML=`${ok===null?"":`<p class="verdict ${ok?"ok":"ko"}">${ok?L("Juste !","Correct!"):L("Pas tout à fait.","Not quite.")} ${L("Réponse attendue","Expected answer")}${COL}${fr(EX.cur.a,4)}</p>`}<div class="steps">${EX.cur.steps}</div>`;
  $(".streak").textContent=streakTxt();
}
function newOrder(){
  const keys=Object.keys(ORDERS); const k=keys[rnd(0,keys.length-1)]; const o=ORDERS[k];
  const items=LANG==="en"?o.en:o.items;
  const pool=shuffle(items.map((t,i)=>i)); let picked=[];
  $("#exo").innerHTML=`<div class="row" style="justify-content:space-between"><span class="tag">${L("Remettre dans l’ordre","Put in order")}</span><span class="streak">${streakTxt()}</span></div>
  <p class="qtext" style="font-size:1.05rem">${L(o.t,o.te)}${COL}${L("clique les étapes dans le bon ordre.","click the steps in the right order.")}</p>
  <div class="order-slots" id="oSlots" aria-label="${L("Ton ordre","Your order")}"></div>
  <div class="order-pool" id="oPool"></div>
  <div class="row"><button class="btn" id="oReset">${L("Recommencer","Start over")}</button><button class="btn ghost" id="exNew">${L("Nouvel exercice","New exercise")} →</button></div><div id="exRes"></div>`;
  const draw=()=>{
    $("#oSlots").innerHTML=picked.map((ix,i)=>`<span class="chip ${picked.length===items.length?(ix===i?"okc":"koc"):""}">${i+1}. ${items[ix]}</span>`).join("")||`<span style="color:var(--muted);font-size:.85rem;padding:4px">${L("Ton ordre apparaîtra ici","Your order will appear here")}</span>`;
    $("#oPool").innerHTML=pool.filter(ix=>!picked.includes(ix)).map(ix=>`<button class="chip" data-o="${ix}">${items[ix]}</button>`).join("");
    $$("#oPool [data-o]").forEach(b=>b.onclick=()=>{picked.push(+b.dataset.o);draw();if(picked.length===items.length)done();});
  };
  const done=()=>{const ok=picked.every((ix,i)=>ix===i); if(ok){S.streak++;S.best=Math.max(S.best,S.streak);}else S.streak=0; save();
    $("#exRes").innerHTML=`<p class="verdict ${ok?"ok":"ko"}">${ok?L("Ordre parfait !","Perfect order!"):L("Pas le bon ordre.","Not the right order.")}</p>${ok?"":`<div class="steps"><b>${L("Ordre correct","Correct order")}${COL.trim()}</b><div class="flow">${items.map((t,i)=>`${i?"<i>→</i>":""}<span>${t}</span>`).join("")}</div></div>`}`;
    $(".streak").textContent=streakTxt();};
  $("#oReset").onclick=()=>{picked=[];$("#exRes").innerHTML="";draw();};
  $("#exNew").onclick=newExo;
  draw();
}

let LAB="id3";
const LABS={id3:["ID3 pas à pas","ID3 step by step"],regs:["Régression simple","Simple regression"],regm:["Régression multiple","Multiple regression"],norm:["Normalisation","Normalization"],rna:["Réseau de neurones","Neural network"]};
RENDER.labos=function(){
  const el=$("#v-labos");
