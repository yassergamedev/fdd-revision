const DS=[[1,"Ensoleillé","Elevée","Elevée","Faible","Non"],[2,"Ensoleillé","Elevée","Elevée","Fort","Non"],[3,"Couvert","Elevée","Elevée","Faible","Oui"],[4,"Pluvieux","Moyenne","Elevée","Faible","Oui"],[5,"Pluvieux","Basse","Normale","Faible","Oui"],[6,"Pluvieux","Basse","Normale","Fort","Non"],[7,"Couvert","Basse","Normale","Fort","Oui"],[8,"Ensoleillé","Moyenne","Elevée","Faible","Non"],[9,"Ensoleillé","Basse","Normale","Faible","Oui"],[10,"Pluvieux","Moyenne","Normale","Faible","Oui"],[11,"Ensoleillé","Moyenne","Normale","Fort","Oui"],[12,"Couvert","Moyenne","Elevée","Fort","Oui"],[13,"Couvert","Elevée","Normale","Faible","Oui"],[14,"Pluvieux","Moyenne","Elevée","Fort","Non"]];
const col=a=>AK.indexOf(a)+1;
function pn(rows){let p=0,n=0;rows.forEach(r=>r[5]==="Oui"?p++:n++);return[p,n];}
function stats(rows,attrs){const[p,n]=pn(rows),HS=H(p,n),T=rows.length;
  return attrs.map(a=>{const vals=ATTRS[a].map(v=>{const sub=rows.filter(r=>r[col(a)]===v);const[pp,nn]=pn(sub);return{v,p:pp,n:nn,h:H(pp,nn)};}).filter(x=>x.p+x.n>0);
    const I=vals.reduce((s,x)=>s+(x.p+x.n)/T*x.h,0);return{a,vals,I,g:HS-I};});}
let TREE=null, ID3wrong=null;
function newNode(rows,attrs,path){const[p,n]=pn(rows);const node={rows,attrs,path};if(!p||!n||!attrs.length){node.leaf=p>=n?"Oui":"Non";}return node;}
function resetTree(){TREE=newNode(DS,AK.slice(),[]);ID3wrong=null;}
function pending(node){if(node.leaf)return null;if(!node.split)return node;for(const k of Object.keys(node.kids)){const r=pending(node.kids[k]);if(r)return r;}return null;}
function splitNode(node,a){node.split=a;node.kids={};ATTRS[a].forEach(v=>{const sub=node.rows.filter(r=>r[col(a)]===v);if(!sub.length)return;node.kids[v]=newNode(sub,node.attrs.filter(x=>x!==a),[...node.path,[a,v]]);});}
function treeHTML(node,cur,hl){
  let cls=node.leaf?"leaf-"+node.leaf.toLowerCase():node.split?"attr":(node===cur?"current":"pending");
  if(hl&&hl.includes(node))cls+=" path";
  const [p,n]=pn(node.rows);
  const label=node.leaf?`${tr(node.leaf)} <span style="font-weight:400;opacity:.8">(${p}|${n})</span>`:node.split?tr(node.split):`? <span style="font-weight:400">(${p}|${n})</span>`;
  let h=`<div class="tnode"><div class="tbox ${cls}">${label}</div>`;

function inv3(m){const[a,b,c]=m[0],[d,e,f]=m[1],[g,h,i]=m[2];const A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,Fv=-(a*h-b*g),G=b*f-c*e,Hv=-(a*f-c*d),I=a*e-b*d;const det=a*A+b*B+c*C;if(Math.abs(det)<1e-12)return null;return[[A/det,D/det,G/det],[B/det,E/det,Hv/det],[C/det,Fv/det,I/det]];}

  <div class="panel" style="display:grid;gap:10px"><h3>${L("Ta colonne","Your column")}</h3><label class="f" for="nIn">${L("Valeurs séparées par des espaces ou des points-virgules","Values separated by spaces or semicolons")}<textarea id="nIn" rows="3">513 ; -2135 ; 120 ; 87 ; 1000 ; -45</textarea></label>
  <div class="row"><label class="row" style="gap:6px;font-size:.88rem"><input type="checkbox" id="nSample" style="accent-color:var(--accent)"> ${L("Écart type corrigé (n − 1)","Corrected std (n − 1)")}</label><label class="f" for="nMM" style="grid-auto-flow:column;align-items:center">${L("Périodes MMS","SMA periods")} <select id="nMM"><option>2</option><option selected>3</option><option>4</option></select></label></div>
  <dl class="kv" id="nKv"></dl></div>
  <div class="panel" style="display:grid;gap:10px;align-content:start"><h3>${L("Rappels","Reminders")}</h3>
  <div class="formula">${L("décimale","decimal")}${COL}v / 10<sup>k</sup></div><div class="formula">min-max${COL}(v − min)/(max − min)</div><div class="formula">z-score${COL}(v − ${L("moyenne","mean")})/${L("écart type","std")}</div><div class="formula">${L("MMS : moyenne des n dernières valeurs","SMA: mean of the last n values")}</div>
  <div class="callout"><b>${L("Exemple diapo 59 :","Slide 59 example:")}</b> ${L("max|v| = 2135 → k = 4 → division par 10 000.","max|v| = 2135 → k = 4 → divide by 10,000.")}</div></div></div>
  <div class="panel"><h3 style="margin-bottom:8px">${L("Résultats","Results")}</h3><div class="tbl" id="nOut"></div></div></div>`;
  ["nIn","nSample","nMM"].forEach(id=>$("#"+id).addEventListener("input",calcNorm));
  $("#nMM").onchange=calcNorm; calcNorm();
};
function calcNorm(){
  const vals=$("#nIn").value.split(/[;\s]+/).filter(Boolean).map(s=>parseFloat(s.replace(",","."))).filter(v=>!isNaN(v));
  if(!vals.length){$("#nOut").innerHTML="";$("#nKv").innerHTML="";return;}
  const n=vals.length,mn=Math.min(...vals),mx=Math.max(...vals),mean=vals.reduce((a,b)=>a+b,0)/n;
  const ss=vals.reduce((s,x)=>s+(x-mean)**2,0);const sd=Math.sqrt(ss/($("#nSample").checked&&n>1?n-1:n));
  const ma=Math.max(...vals.map(Math.abs));let k=0;while(ma/10**k>=1)k++;
  const p=+$("#nMM").value;
  $("#nKv").innerHTML=`<dt>n</dt><dd>${n}</dd><dt>min / max</dt><dd>${fr(mn,3)} / ${fr(mx,3)}</dd><dt>${L("moyenne","mean")}</dt><dd>${fr(mean,4)}</dd><dt>${L("écart type","std")}</dt><dd>${fr(sd,4)}</dd><dt>max|v| → k</dt><dd>${fr(ma,3)} → k = ${k} (÷ ${fr(10**k,0)})</dd>`;
  $("#nOut").innerHTML=`<table class="dtable"><tr><th>i</th><th class="num">v</th><th class="num">${L("décimale","decimal")}</th><th class="num">min-max</th><th class="num">z-score</th><th class="num">${L("MMS","SMA")} (${p})</th></tr>${vals.map((v,i)=>`<tr><td>${i+1}</td><td class="num">${fr(v,3)}</td><td class="num">${fr(v/10**k,4)}</td><td class="num">${mx===mn?"—":fr((v-mn)/(mx-mn),4)}</td><td class="num">${sd?fr((v-mean)/sd,4):"—"}</td><td class="num">${i>=p-1?fr(vals.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p,3):"—"}</td></tr>`).join("")}</table>`;
}

/* ---- Neural network ---- */
let NN={x:[65,1.6],t:[1,0],W1:[[0.2,0.23],[0.31,0.43],[0.35,0.5]],b1:[0.6,0.4,0.2],W2:[[0.15,0.25,0.17],[0.34,0.09,0.28]],b2:[0.25,0.2],eta:0.5,iter:0};
const NN0=JSON.parse(JSON.stringify(NN));
function nnForward(){const nh=NN.W1.map((w,j)=>w[0]*NN.x[0]+w[1]*NN.x[1]+NN.b1[j]);const oh=nh.map(sig);const no=NN.W2.map((w,k)=>w.reduce((s,v,j)=>s+v*oh[j],0)+NN.b2[k]);const oo=no.map(sig);const E=oo.reduce((s,o,k)=>s+.5*(o-NN.t[k])**2,0);return{nh,oh,no,oo,E};}
LABR.rna=function(){
  const lab=$("#lab");
  lab.innerHTML=`<div class="view" style="gap:16px">
  <div class="panel nn" style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><h3>${L("Réseau 2-3-2 de la diapo 160","The 2-3-2 network from slide 160")}</h3><button class="btn sm ghost" id="nnReset">${L("Valeurs du cours","Course values")}</button></div><div id="nnSvg"></div></div>
  <div class="grid2">
    <div class="panel" style="display:grid;gap:12px;align-content:start"><h3>${L("Entrées","Inputs")}</h3>
      <div class="row"><label class="f" for="nnX0">${L("Poids (kg)","Weight (kg)")}<input type="text" id="nnX0" value="${fr(NN.x[0],3)}" inputmode="decimal"></label><label class="f" for="nnX1">${L("Taille (m)","Height (m)")}<input type="text" id="nnX1" value="${fr(NN.x[1],3)}" inputmode="decimal"></label>
      <label class="f" for="nnT">${L("Vraie classe","True class")}<select id="nnT"><option value="1" ${NN.t[0]===1?"selected":""}>${L("Adulte (1, 0)","Adult (1, 0)")}</option><option value="0" ${NN.t[0]===0?"selected":""}>${L("Enfant (0, 1)","Child (0, 1)")}</option></select></label></div>
      <div id="nnFwd"></div></div>
    <div class="panel" style="display:grid;gap:12px;align-content:start"><h3>${L("Rétropropagation de w₇","Backpropagation of w₇")}</h3>
      <label class="f" for="nnEta">${L("Taux d’apprentissage","Learning rate")} η = <b id="nnEtaV" class="mono"></b><input type="range" id="nnEta" min="0.05" max="2" step="0.05" value="${NN.eta}"></label>
      <div id="nnBack"></div>
      <div class="row"><button class="btn primary" id="nnStep">${L("Appliquer une itération (w₇…w₁₂)","Apply one iteration (w₇…w₁₂)")}</button><span class="mono" id="nnIter"></span></div>
      <div class="callout tip"><b>${L("À remarquer :","Notice:")}</b> ${L("les entrées ne sont pas normalisées (65 kg), donc les nœuds cachés saturent (out ≈ 1, out(1 − out) ≈ 0). Leurs poids ne bougent presque pas : c’est une bonne raison de normaliser (chapitre normalisation).","the inputs are not normalized (65 kg), so the hidden nodes saturate (out ≈ 1, out(1 − out) ≈ 0). Their weights barely move: a good reason to normalize (normalization chapter).")}</div></div>
  </div></div>`;
  $("#nnX0").oninput=e=>{const v=parseNum(e.target.value);if(!isNaN(v)){NN.x[0]=v;drawNN();}};
  $("#nnX1").oninput=e=>{const v=parseNum(e.target.value);if(!isNaN(v)){NN.x[1]=v;drawNN();}};
  $("#nnT").onchange=e=>{NN.t=e.target.value==="1"?[1,0]:[0,1];drawNN();};
  $("#nnEta").oninput=e=>{NN.eta=+e.target.value;drawNN();};
  $("#nnStep").onclick=()=>{const f=nnForward();NN.W2=NN.W2.map((w,k)=>{const d=(f.oo[k]-NN.t[k])*f.oo[k]*(1-f.oo[k]);return w.map((v,j)=>v-NN.eta*d*f.oh[j]);});NN.iter++;drawNN();};
  $("#nnReset").onclick=()=>{NN=JSON.parse(JSON.stringify(NN0));LABR.rna();};
  drawNN();
};
function drawNN(){
  const f=nnForward();
  $("#nnEtaV").textContent=fr(NN.eta,2);
  const W=760,Hh=330; const X=[90,380,670]; const yI=[110,230], yH=[70,170,270], yO=[110,230];
  const wo=[["w₇","w₉","w₁₁"],["w₈","w₁₀","w₁₂"]];
  let s=`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L("Schéma du réseau de neurones","Neural network diagram")}">`;
  const lbl=(x,y,t,c="var(--muted)")=>`<rect x="${x-24}" y="${y-9}" width="48" height="16" rx="4" fill="var(--surface)"/><text x="${x}" y="${y+3}" text-anchor="middle" font-size="10.5" font-family="var(--f-mono)" fill="${c}">${t}</text>`;
  NN.W1.forEach((w,j)=>w.forEach((v,i)=>{s+=`<line x1="${X[0]}" y1="${yI[i]}" x2="${X[1]}" y2="${yH[j]}" stroke="var(--line)" stroke-width="1.6"/>`;}));
  NN.W2.forEach((w,k)=>w.forEach((v,j)=>{s+=`<line x1="${X[1]}" y1="${yH[j]}" x2="${X[2]}" y2="${yO[k]}" stroke="${k===0&&j===0?"var(--ore)":"var(--line)"}" stroke-width="${k===0&&j===0?2.6:1.6}"/>`;}));
  NN.W1.forEach((w,j)=>w.forEach((v,i)=>{const t=i===0?.3:.62;const x=X[0]+(X[1]-X[0])*t,y=yI[i]+(yH[j]-yI[i])*t;s+=lbl(x,y,`${fr(v,2)}`);}));
  NN.W2.forEach((w,k)=>w.forEach((v,j)=>{const t=k===0?.32:.66;const x=X[1]+(X[2]-X[1])*t,y=yH[j]+(yO[k]-yH[j])*t;s+=lbl(x,y,`${wo[k][j]} ${fr(v,3)}`,k===0&&j===0?"var(--ore)":"var(--muted)");}));
  const node=(x,y,top,bot,fill="var(--surface)",stroke="var(--fg)")=>`<circle cx="${x}" cy="${y}" r="27" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${x}" y="${y-2}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fg)" font-family="var(--f-display)">${top}</text><text x="${x}" y="${y+13}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${bot}</text>`;
  s+=node(X[0],yI[0],L("Poids","Weight"),fr(NN.x[0],2))+node(X[0],yI[1],L("Taille","Height"),fr(NN.x[1],2));
  yH.forEach((y,j)=>{s+=node(X[1],y,"h"+(j+1),fr(f.oh[j],3),"var(--accent-soft)","var(--accent)")+`<text x="${X[1]}" y="${y-34}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">b=${fr(NN.b1[j],2)}</text>`;});
  yO.forEach((y,k)=>{s+=node(X[2],y,[L("Adulte","Adult"),L("Enfant","Child")][k],fr(f.oo[k],3),"var(--ore-soft)","var(--ore)")+`<text x="${X[2]}" y="${y-34}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">b=${fr(NN.b2[k],2)}</text><text x="${X[2]+36}" y="${y+4}" font-size="11" fill="var(--muted)">${L("cible","target")} ${NN.t[k]}</text>`;});
  [L("Couche 1 (entrée)","Layer 1 (input)"),L("Couche 2 (cachée)","Layer 2 (hidden)"),L("Couche 3 (sortie)","Layer 3 (output)")].forEach((t,i)=>{s+=`<text x="${X[i]}" y="${Hh-12}" text-anchor="middle" font-size="12" fill="var(--muted)">${t}</text>`;});
  s+=`</svg>`;
  $("#nnSvg").innerHTML=`<div class="tbl">${s}</div>`;
  $("#nnFwd").innerHTML=`<table class="dtable"><tr><th>${L("Nœud","Node")}</th><th>net</th><th class="num">out = σ(net)</th></tr>
  ${NN.W1.map((w,j)=>`<tr><td>h${j+1}</td><td class="mono" style="white-space:normal">${fr(NN.x[0],2)}×${fr(w[0],2)} + ${fr(NN.x[1],2)}×${fr(w[1],2)} + ${fr(NN.b1[j],2)} = ${fr(f.nh[j],3)}</td><td class="num">${fr(f.oh[j],6)}</td></tr>`).join("")}
  ${NN.W2.map((w,k)=>`<tr><td>${["o1","o2"][k]}</td><td class="mono" style="white-space:normal">${w.map((v,j)=>`${fr(v,3)}×${fr(f.oh[j],3)}`).join(" + ")} + ${fr(NN.b2[k],2)} = ${fr(f.no[k],3)}</td><td class="num">${fr(f.oo[k],3)}</td></tr>`).join("")}</table>
  <div class="formula">E = ½(${fr(f.oo[0],3)} − ${NN.t[0]})² + ½(${fr(f.oo[1],3)} − ${NN.t[1]})² = <b>${fr(f.E,4)}</b></div>`;
  const o=f.oo[0],t=NN.t[0],d1=o-t,d2=o*(1-o),d3=f.oh[0],g=d1*d2*d3,w7=NN.W2[0][0];
  $("#nnBack").innerHTML=`<div class="formula">${FR("∂E","∂out<sub>o1</sub>")} = ${fr(o,3)} − ${t} = ${fr(d1,4)}</div>
  <div class="formula">${FR("∂out<sub>o1</sub>","∂net<sub>o1</sub>")} = ${fr(o,3)} × (1 − ${fr(o,3)}) = ${fr(d2,4)}</div>
  <div class="formula">${FR("∂net<sub>o1</sub>","∂w<sub>7</sub>")} = out<sub>h1</sub> = ${fr(d3,6)}</div>
  <div class="formula">${FR("∂E","∂w<sub>7</sub>")} = ${fr(d1,4)} × ${fr(d2,4)} × ${fr(d3,4)} = <b>${fr(g,4)}</b></div>
  <div class="formula">w<sub>7</sub><sup>+</sup> = ${fr(w7,4)} − ${fr(NN.eta,2)} × (${fr(g,4)}) = <b>${fr(w7-NN.eta*g,4)}</b></div>`;
  $("#nnIter").textContent=NN.iter?L(`${NN.iter} itération${NN.iter>1?"s":""} · E = ${fr(f.E,4)}`,`${NN.iter} iteration${NN.iter>1?"s":""} · E = ${fr(f.E,4)}`):"";
}

/* ============================== KEYBOARD ============================== */
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  const v=curView();
  if(v==="quiz"&&QZ&&!QZ.done){
    if(/^[1-4]$/.test(e.key)){const b=$$(".opt")[+e.key-1];if(b&&!b.disabled)b.click();}
    if(e.key==="Enter"){const n=$("#qNext");if(n&&!n.hidden){e.preventDefault();n.click();}}
  }
  if(v==="cartes"){
    if(e.key===" "){const c=$("#fcard");if(c){e.preventDefault();c.classList.toggle("flipped");}}
    if(e.key==="ArrowRight"&&$("#fcYes"))rate(1);
    if(e.key==="ArrowLeft"&&$("#fcNo"))rate(0);
  }
});

applyLang();
go(curView());
</script>
